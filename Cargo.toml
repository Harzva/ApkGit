[package]
name = "gitmarket"
version = "0.1.2"
edition = "2021"
description = "GitHub/Gitee Release software discovery tool"
authors = ["GitMarket Team"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/harzva/GitReleaseMarket"
keywords = ["github", "release", "downloader", "foss", "market"]
categories = ["gui", "network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"

# Android platform dependencies for the experimental cargo-apk target.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"

[[bin]]
name = "gitmarket"
path = "src/main.rs"

# Experimental Rust Android packaging. The primary Android route is the
# android-preview Gradle project, and the polished mobile MVP should be native.
[package.metadata.android]
application_id = "com.gitmarket.app"
label = "GitMarket"
version_code = 3
version_name = "0.1.2"
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[package.metadata.android.build_targets]
aarch64 = true
armv7 = false
x86 = false
x86_64 = false

[package.metadata.android.application]
debuggable = false
