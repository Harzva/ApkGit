[package]
name = "gitmarket"
version = "0.3.5"
edition = "2021"
description = "Human and agent Git release, skill, and MCP discovery market"
authors = ["GitMarket Team"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/harzva/GitReleaseMarket"
keywords = ["github", "release", "agent", "mcp", "market"]
categories = ["gui", "network-programming"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"

# Android platform dependencies for the experimental cargo-apk target.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "gitmarket"
path = "src/main.rs"

[lib]
name = "gitmarket"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Experimental Rust Android packaging. This is the only Android artifact built
# by CI until the future native Kotlin/Compose app replaces it.
[package.metadata.android]
package = "com.gitmarket.app"
build_targets = ["aarch64-linux-android"]
resources = "android-res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[package.metadata.android.application]
label = "GitMarket"
debuggable = false
icon = "@mipmap/ic_launcher"
