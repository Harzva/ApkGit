name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev

      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: gitmarket
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            binary: gitmarket
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            binary: gitmarket
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: gitmarket.exe
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/${{ matrix.binary }}"
          cp README.md LICENSE SECURITY.md PRIVACY.md DISCLAIMER.md dist/package/

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar czf "gitmarket-${{ matrix.name }}.tar.gz" package

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath dist/gitmarket-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-android-experimental:
    name: Build Android experimental
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Restore experimental signing key
        run: |
          # Public experimental key for install-over-install continuity.
          # Never use this key for a production Android signing track.
          python3 - <<'PY'
          import base64
          from pathlib import Path

          encoded = Path("ci/gitmarket-experimental.jks.base64").read_text(encoding="ascii")
          Path("gitmarket-experimental.jks").write_bytes(base64.b64decode(encoded))
          PY
          keytool -list -keystore gitmarket-experimental.jks -storepass gitmarketexperimental -alias gitmarket

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/gitmarket-experimental.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: gitmarketexperimental
        run: |
          set +e
          cargo apk build -p gitmarket --release
          cargo_apk_status=$?
          set -e

          if [ ! -f target/release/apk/gitmarket.apk ]; then
            exit "$cargo_apk_status"
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs target/release/apk/gitmarket.apk

          if [ "$cargo_apk_status" -ne 0 ]; then
            echo "::warning::cargo-apk exited with $cargo_apk_status after producing a verified APK"
          fi

      - name: Stage APK
        run: |
          mkdir -p dist
          cp target/release/apk/gitmarket.apk dist/gitmarket-android-experimental.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-android-experimental
          path: dist/*.apk

  build-ios-preview:
    name: Build iOS simulator preview
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/GitMarket/GitMarket.xcodeproj \
            -scheme GitMarket \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          mkdir -p dist
          APP_PATH="$(find ios/build/Build/Products/Release-iphonesimulator -name 'GitMarket.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "GitMarket.app not found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/gitmarket-ios-simulator.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-ios-simulator
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android-experimental, build-ios-preview]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gitmarket-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
