name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev

      - name: Verify lockfile
        run: cargo generate-lockfile --locked

      - name: Format check
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: gitmarket
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            binary: gitmarket
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: gitmarket.exe
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/${{ matrix.binary }}"
          cp README.md LICENSE SECURITY.md PRIVACY.md DISCLAIMER.md dist/package/

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar czf "gitmarket-${{ matrix.name }}.tar.gz" package

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/package/* -DestinationPath dist/gitmarket-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-android-experimental:
    name: Build Android experimental
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Create experimental signing key
        run: |
          keytool -genkeypair \
            -keystore gitmarket-experimental.jks \
            -storepass gitmarketexperimental \
            -keypass gitmarketexperimental \
            -alias gitmarket \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GitMarket Experimental,O=GitMarket,C=US"

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/gitmarket-experimental.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: gitmarketexperimental
        run: |
          set +e
          cargo apk build -p gitmarket --release
          cargo_apk_status=$?
          set -e

          if [ ! -f target/release/apk/gitmarket.apk ]; then
            exit "$cargo_apk_status"
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs target/release/apk/gitmarket.apk

          if [ "$cargo_apk_status" -ne 0 ]; then
            echo "::warning::cargo-apk exited with $cargo_apk_status after producing a verified APK"
          fi

      - name: Stage APK
        run: |
          mkdir -p dist
          cp target/release/apk/gitmarket.apk dist/gitmarket-android-experimental.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-android-experimental
          path: dist/*.apk

  build-android-preview:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create release signing key
        run: |
          keytool -genkeypair \
            -keystore android-preview/gitmarket-preview.jks \
            -storepass gitmarketpreview \
            -keypass gitmarketpreview \
            -alias gitmarket \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GitMarket Preview,O=GitMarket,C=US"

      - name: Build signed preview APK
        run: |
          cd android-preview
          ./gradlew :app:assembleRelease \
            -PreleaseStoreFile="$(pwd)/gitmarket-preview.jks" \
            -PreleaseStorePassword=gitmarketpreview \
            -PreleaseKeyAlias=gitmarket \
            -PreleaseKeyPassword=gitmarketpreview

      - name: Stage APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp android-preview/app/build/outputs/apk/release/app-release.apk "dist/gitmarket-android-preview-${VERSION}.apk"
          sha256sum "dist/gitmarket-android-preview-${VERSION}.apk" > "dist/gitmarket-android-preview-${VERSION}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitmarket-android-preview
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android-preview, build-android-experimental]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gitmarket-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
